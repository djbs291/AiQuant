# Online learning: an SGD model that keeps training through the out-of-sample stretch.
#
#   ./build/aiquant run-config examples/sgd_online.ini --json \
#     | jq '{model, validation_rmse, online_validation_rmse, online_updates}'
#
# `validation_rmse` scores the model as trained; `online_validation_rmse` scores the same
# rows predict-then-learn, so the two numbers are directly comparable.
#
# It reuses the tick file that ships with the repo, so there is nothing to fetch.
# Run it from the repo root: relative paths resolve against the working directory.

ticks = scenarios/ticks_mvp.csv
tf = M1

# ridge (the default, closed-form) or sgd. Only sgd can keep learning.
model = sgd

# Standardization is what lets one learning rate serve close (~100) and macd (~0.01).
# Turn it off and the first gradient step overshoots; the model says so rather than
# quietly producing NaNs.
sgd_standardize = true
# Tuned on this tick file, where these settings put the SGD fit below the ridge solver's
# validation RMSE on the same rows. Another feature set or timeframe will want different
# numbers: the rate is the knob between crawling and diverging, and the model says which.
sgd_learning_rate = 0.3
sgd_l2 = 1e-7
sgd_epochs = 800
# eta_t = learning_rate / (1 + t)^power_t. Zero holds the rate constant.
sgd_power_t = 0.25

# Every candle past the training split hands the model the delta it has just realized.
online_update = true

train_ratio = 0.7

rsi_buy = 30.0
rsi_sell = 70.0
use_ema_crossover = true

preview = 3
