# A scenario with a wider feature set than the default six.
#
#   ./build/aiquant run-config examples/wide_features.ini --json
#
# It reuses the tick file that ships with the repo, so there is no extra data to fetch.
# Run it from the repo root: relative paths resolve against the working directory.

ticks = scenarios/ticks_mvp.csv
tf = M1

# Every output of every indicator is available; see docs/ScenarioConfig.md for the catalogue.
# Note the warmup: adx needs 2N-1 candles, so a longer set eats more of the series before the
# first feature row appears. The resolved set and the counts come back in the JSON.
features = close,ema_fast,rsi,atr,adx,bb_mid

# Periods for the indicators the list reaches beyond the defaults.
atr = 14
adx = 14
bb_period = 20
bb_k = 2.0

train_ratio = 0.7
ridge = 1e-6

rsi_buy = 30.0
rsi_sell = 70.0
use_ema_crossover = true

preview = 3
