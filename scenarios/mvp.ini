# Ready-to-run MVP scenario. Paths are resolved from the working directory,
# so run it from the repo root: ./build/aiquant run-config scenarios/mvp.ini
ticks = scenarios/ticks_mvp.csv
tf = M1

# Model feature set, in column order. Omit it for the historical six:
# close, ema_fast, rsi, macd, macd_signal, macd_hist.
# See docs/ScenarioConfig.md for the full catalogue and the warmup caveats.
# features = close,ema_fast,rsi,atr,adx

train_ratio = 0.7
ridge = 1e-6

ema_fast = 12
ema_slow = 26
rsi = 14
macd_fast = 12
macd_slow = 26
macd_signal = 9

rsi_buy = 30.0
rsi_sell = 70.0
use_ema_crossover = true

preview = 3
