name: Deploy landing to GitHub Pages

# Publishes site/ to GitHub Pages. One-time setup in the repo: Settings -> Pages ->
# "Build and deployment" -> Source: "GitHub Actions". After that this runs on every push to
# main that touches the landing.
on:
  push:
    branches: [ main ]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer one supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # enablement: true turns Pages on for the repo if it is not already, so no manual
      # Settings -> Pages step is needed (the workflow's pages:write permission covers it).
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the landing as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
