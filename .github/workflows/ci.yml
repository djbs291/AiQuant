name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-linux:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache pybind11-dev python3-dev

      # Reference implementation for the indicator golden tests.
      - name: Install TA-Lib
        uses: TA-Lib/setup-ta-lib@v1
        with:
          version: 0.6.4

      - name: Configure (Debug)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAIQUANT_WITH_TALIB=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build -- -v

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Python module smoke test
        run: |
          # Use the interpreter CMake built the module against (ABI must match).
          PY=$(sed -n 's/^_Python3_EXECUTABLE:INTERNAL=//p' build/CMakeCache.txt)
          PYTHONPATH=build "${PY:-python3}" tests/python/smoke_test.py

      - name: HTTP service smoke test
        run: python3 tests/http/smoke_test.py

      # Keeps the examples honest: they break the build if they stop working.
      - name: Examples
        run: |
          ./build/aiquant run-config examples/wide_features.ini --json > /dev/null
          ./build/aiquant run-config examples/sgd_online.ini --json > /dev/null
          ./build/aiquant stream scenarios/ticks_mvp.csv --tf M1 --all > /dev/null
          PY=$(sed -n 's/^_Python3_EXECUTABLE:INTERNAL=//p' build/CMakeCache.txt)
          PYTHONPATH=build "${PY:-python3}" examples/run_scenario.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/**/*.log
            build/**/*.xml

  build-test-macos:
    name: Build & Test (macOS)
    runs-on: macos-latest

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        # catch2 here means FetchContent finds it installed and skips the download.
        run: brew install ninja pybind11 catch2 ta-lib

      - name: Configure (Debug)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAIQUANT_WITH_TALIB=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Python module smoke test
        run: |
          # Use the interpreter CMake built the module against (ABI must match).
          PY=$(sed -n 's/^_Python3_EXECUTABLE:INTERNAL=//p' build/CMakeCache.txt)
          PYTHONPATH=build "${PY:-python3}" tests/python/smoke_test.py

      - name: HTTP service smoke test
        run: python3 tests/http/smoke_test.py

      - name: Examples
        run: |
          ./build/aiquant run-config examples/wide_features.ini --json > /dev/null
          ./build/aiquant run-config examples/sgd_online.ini --json > /dev/null
          ./build/aiquant stream scenarios/ticks_mvp.csv --tf M1 --all > /dev/null
          PY=$(sed -n 's/^_Python3_EXECUTABLE:INTERNAL=//p' build/CMakeCache.txt)
          PYTHONPATH=build "${PY:-python3}" examples/run_scenario.py

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: |
            build/Testing/Temporary/LastTest.log
            build/**/*.log
            build/**/*.xml

  docker-build:
    name: Docker image (Debian GCC, Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the service image exactly as a host like Render does: Release + GCC on Debian
      # bookworm. This is the one job that compiles the project in Release on Linux, so it
      # catches portability breaks the Debug jobs miss -- e.g. a header that only newer GCC and
      # Clang pull in transitively. (That class broke a deploy once; this stops it recurring.)
      - name: Build the service image
        run: docker build -t aiquant-http .

      - name: Smoke-check the built image
        run: |
          docker run -d --rm -p 8080:8080 -e AIQUANT_API_KEYS=ci-test-key --name aiquant aiquant-http
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          docker logs aiquant || true
          docker stop aiquant || true
          test "$ok" = "1"
